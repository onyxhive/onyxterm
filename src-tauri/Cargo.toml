[package]
name = "onyx-hive"
version = "0.8.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "onyx_hive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.1", features = ["v4"] }
tauri-plugin-dialog = "2.8.4"
dirs = "7.0.0"
portable-pty = "0.9"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
